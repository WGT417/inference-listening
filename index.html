<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>추론적 듣기 심화 탐구방</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gmarket+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --primary:#0D9488;--primary-dark:#0F766E;--accent:#F59E0B;--danger:#EF4444;
  --bg:#F0FDFA;--card:#FFFFFF;--text:#134E4A;--muted:#6B7280;--border:#CCFBF1;
  --sh:0 4px 20px rgba(13,148,136,.12);--sh2:0 10px 40px rgba(13,148,136,.18);
  --r:16px;--rs:10px;
  --c-meal:#F59E0B;--c-allowance:#10B981;--c-game:#8B5CF6;--c-idol:#EC4899;--c-sports:#3B82F6;--c-teacher:#0D9488;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
.hidden{display:none!important;}
.btn{padding:10px 22px;border:none;border-radius:50px;font-family:'Noto Sans KR',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;touch-action:manipulation;}
.btn-p{background:var(--primary);color:#fff;}.btn-p:hover{background:var(--primary-dark);}
.btn-g{background:transparent;color:var(--primary);border:2px solid var(--primary);}.btn-g:hover{background:var(--primary);color:#fff;}

/* 로딩 */
#loadingPage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D9488,#0891B2);}
.spinner-wrap .sp{width:48px;height:48px;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px;}
#loadingPage p{color:rgba(255,255,255,.85);font-size:15px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 로그인 */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D9488,#0891B2,#2563EB);padding:20px;}
.lcard{background:rgba(255,255,255,.97);border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:up .5s ease;}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.llogo{text-align:center;margin-bottom:32px;}
.llogo .em{font-size:52px;display:block;margin-bottom:8px;}
.llogo h1{font-family:'Gmarket Sans',sans-serif;font-size:24px;font-weight:700;color:var(--primary);}
.llogo p{color:var(--muted);font-size:13px;margin-top:4px;}
.fg{margin-bottom:18px;}
.fg label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;}
.fg select,.fg input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:var(--rs);font-family:'Noto Sans KR',sans-serif;font-size:16px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
.fg select{-webkit-appearance:none;appearance:none;}
.fg select:focus,.fg input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(13,148,136,.12);background:#fff;}
.lbtn{width:100%;padding:16px;font-size:16px;border-radius:var(--rs);margin-top:8px;letter-spacing:1px;touch-action:manipulation;}
.lerr{background:#FEF2F2;border:1px solid #FECACA;color:#DC2626;border-radius:var(--rs);padding:12px 16px;font-size:13px;margin-top:14px;text-align:center;}

/* 메인 */
#mainPage{display:flex;flex-direction:column;min-height:100vh;}
.hdr{background:linear-gradient(90deg,var(--primary),#0891B2);color:white;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(13,148,136,.3);}
.hdr-logo{font-family:'Gmarket Sans',sans-serif;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.hdr-r{display:flex;align-items:center;gap:12px;}
.ubadge{background:rgba(255,255,255,.2);border-radius:50px;padding:5px 14px;font-size:13px;font-weight:500;}
.atag{background:var(--accent);color:#1E1B4B;border-radius:4px;font-size:10px;font-weight:900;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.lout-btn{background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.3);padding:6px 14px;font-size:12px;}
.content{flex:1;padding:24px;}

/* 홈 */
.home h2{font-family:'Gmarket Sans',sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;}
.home .sub{color:var(--muted);font-size:14px;margin-bottom:28px;}
.rsec{margin-bottom:32px;}
.rsec h3{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.rcard{background:var(--card);border-radius:var(--r);padding:22px 18px;cursor:pointer;transition:all .25s;box-shadow:var(--sh);border:2px solid transparent;text-align:center;position:relative;overflow:hidden;touch-action:manipulation;}
.rcard::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;}
.rcard:hover,.rcard:active{transform:translateY(-4px);box-shadow:var(--sh2);}
.rcard .ri{font-size:32px;margin-bottom:10px;display:block;}
.rcard .rn{font-size:14px;font-weight:700;}
.rcard .rc{font-size:11px;color:var(--muted);margin-top:4px;}
.rc-meal{color:var(--c-meal)}.rc-meal::before{background:var(--c-meal)}
.rc-allowance{color:var(--c-allowance)}.rc-allowance::before{background:var(--c-allowance)}
.rc-game{color:var(--c-game)}.rc-game::before{background:var(--c-game)}
.rc-idol{color:var(--c-idol)}.rc-idol::before{background:var(--c-idol)}
.rc-sports{color:var(--c-sports)}.rc-sports::before{background:var(--c-sports)}
.rc-teacher{color:var(--c-teacher)}.rc-teacher::before{background:var(--c-teacher)}

/* 게시판 */
.bhdr{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.back-btn{background:white;border:2px solid var(--border);border-radius:50px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;touch-action:manipulation;}
.back-btn:hover{border-color:var(--primary);color:var(--primary);}
.btitle{font-family:'Gmarket Sans',sans-serif;font-size:22px;font-weight:700;}
.bbadge{padding:4px 14px;border-radius:50px;font-size:12px;font-weight:700;color:white;}
.rt-label{font-size:12px;color:#10B981;font-weight:700;display:flex;align-items:center;gap:4px;}
.rt-dot{width:8px;height:8px;background:#10B981;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 세션 탭 */
.session-tabs{display:flex;gap:8px;margin-bottom:20px;}
.session-tab{flex:1;background:white;border:2px solid var(--border);border-radius:var(--rs);padding:14px;text-align:center;cursor:pointer;transition:all .2s;touch-action:manipulation;}
.session-tab.active{border-color:var(--primary);background:linear-gradient(135deg,#F0FDFA,#ECFEFF);}
.session-tab .stitle{font-size:14px;font-weight:700;color:var(--text);}
.session-tab .sdesc{font-size:11px;color:var(--muted);margin-top:3px;}

/* 오디오 플레이어 */
.audio-box{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:20px;}
.audio-box .albl{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.audio-box audio{width:100%;}
.passage-toggle{background:var(--bg);border:1px solid var(--border);color:var(--primary);font-size:12px;font-weight:700;padding:6px 14px;border-radius:20px;cursor:pointer;margin-top:12px;touch-action:manipulation;font-family:'Noto Sans KR',sans-serif;}
.passage-toggle:hover{background:var(--primary);color:white;}
.passage-box{margin-top:14px;background:var(--bg);border-radius:var(--rs);padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap;color:#374151;max-height:400px;overflow-y:auto;}

/* 질문 카드 */
.qcard{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);margin-bottom:14px;border-left:4px solid var(--primary);}
.qcard .qnum{font-size:11px;font-weight:900;color:var(--primary);background:#F0FDFA;display:inline-block;padding:2px 10px;border-radius:20px;margin-bottom:8px;}
.qcard .qtext{font-size:14px;font-weight:700;line-height:1.6;margin-bottom:12px;}

/* 답변 카드들 (패들렛형) */
.cgrid{columns:3;column-gap:16px;}
@media(max-width:900px){.cgrid{columns:2}}
@media(max-width:560px){.cgrid{columns:1}}
.pcard{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;break-inside:avoid;box-shadow:var(--sh);border-left:4px solid var(--primary);transition:box-shadow .2s,transform .2s;animation:cin .3s ease;}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pcard:hover{box-shadow:var(--sh2);transform:translateY(-2px);}
.pau{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.pav{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:white;flex-shrink:0;}
.pan{font-size:13px;font-weight:700;}
.pt{font-size:11px;color:var(--muted);margin-left:auto;}
.pbody{font-size:13px;line-height:1.7;color:#374151;white-space:pre-wrap;word-break:break-word;}
.pfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.edit-btn{background:var(--bg);color:var(--primary);border:1px solid var(--border);padding:5px 14px;font-size:12px;border-radius:20px;cursor:pointer;font-weight:700;transition:all .2s;touch-action:manipulation;}
.edit-btn:hover{background:var(--primary);color:white;}
.del-btn{background:#FEF2F2;color:var(--danger);border:1px solid #FECACA;padding:5px 14px;font-size:12px;border-radius:20px;cursor:pointer;font-weight:700;transition:all .2s;touch-action:manipulation;}
.del-btn:hover{background:var(--danger);color:white;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty .ei{font-size:56px;margin-bottom:14px;display:block;}
.empty p{font-size:15px;font-weight:500;}
.empty small{font-size:13px;margin-top:8px;display:block;}
.loading{text-align:center;padding:60px 20px;}
.sp2{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}

/* 댓글 */
.cmtsec{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.cmttog{background:none;border:none;color:var(--primary);font-size:12px;font-weight:700;cursor:pointer;padding:0;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;}
.cmtlist{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.citem{background:var(--bg);border-radius:10px;padding:10px 12px;position:relative;}
.citem.adm{background:linear-gradient(135deg,#FFF7ED,#FEF3C7);border:1px solid #FDE68A;}
.chdr{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.cav{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:white;flex-shrink:0;}
.cav.adm-av{background:linear-gradient(135deg,#F59E0B,#EF4444)!important;}
.can{font-size:12px;font-weight:700;}
.can.adm-n{color:#D97706;}
.abadge{background:#F59E0B;color:white;font-size:9px;font-weight:900;padding:1px 5px;border-radius:3px;margin-left:3px;vertical-align:middle;}
.ct{font-size:10px;color:var(--muted);margin-left:auto;}
.cbody{font-size:13px;color:#374151;line-height:1.6;word-break:break-word;}
.cbtns{display:flex;gap:6px;margin-top:8px;justify-content:flex-end;}
.cedit-btn{background:#EEF2FF;border:1px solid #C7D2FE;color:var(--primary);font-size:11px;font-weight:700;cursor:pointer;padding:3px 8px;border-radius:10px;touch-action:manipulation;font-family:'Noto Sans KR',sans-serif;}
.cedit-btn:hover{background:var(--primary);color:white;}
.cdel{background:#FEF2F2;border:1px solid #FECACA;color:var(--danger);font-size:11px;font-weight:700;cursor:pointer;padding:3px 8px;border-radius:10px;touch-action:manipulation;font-family:'Noto Sans KR',sans-serif;}
.cdel:hover{background:var(--danger);color:white;}
.cinrow{display:flex;gap:8px;margin-top:10px;align-items:flex-end;}
.cin{flex:1;padding:9px 12px;border:2px solid var(--border);border-radius:20px;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--text);background:white;outline:none;transition:border-color .2s;resize:none;min-height:38px;max-height:80px;}
.cin:focus{border-color:var(--primary);}
.csub{background:var(--primary);color:white;border:none;border-radius:20px;padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;flex-shrink:0;}
.csub:hover{background:var(--primary-dark);}

/* FAB */
.fab{position:fixed;bottom:28px;right:28px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#0891B2);color:white;font-size:28px;border:none;cursor:pointer;box-shadow:0 8px 30px rgba(13,148,136,.4);display:flex;align-items:center;justify-content:center;transition:all .25s;z-index:200;touch-action:manipulation;}
.fab:hover{transform:scale(1.1) rotate(90deg);}

/* 모달 */
.mback{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--card);border-radius:24px;padding:32px;width:100%;max-width:520px;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:up .3s ease;max-height:90vh;overflow-y:auto;}
.modal h3{font-family:'Gmarket Sans',sans-serif;font-size:20px;font-weight:700;margin-bottom:20px;}
.mfg{margin-bottom:14px;}
.mfg label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;}
.mfg .qtext-modal{font-size:13px;color:var(--text);background:var(--bg);border-radius:var(--rs);padding:12px 14px;line-height:1.6;margin-bottom:8px;}
.mfg input,.mfg textarea{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:var(--rs);font-family:'Noto Sans KR',sans-serif;font-size:16px;color:var(--text);background:var(--bg);outline:none;transition:border-color .2s;}
.mfg input:focus,.mfg textarea:focus{border-color:var(--primary);background:white;}
.mfg textarea{resize:vertical;min-height:90px;}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}

/* 댓글 수정 모달 */
.cmedit-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1100;display:flex;align-items:center;justify-content:center;padding:20px;}
.cmedit-box{background:white;border-radius:20px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:up .3s ease;}
.cmedit-box h4{font-family:'Gmarket Sans',sans-serif;font-size:17px;font-weight:700;margin-bottom:16px;}
.cmedit-ta{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:var(--rs);font-family:'Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;resize:vertical;min-height:100px;transition:border-color .2s;}
.cmedit-ta:focus{border-color:var(--primary);background:white;}
.cmedit-act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}

/* 토스트 */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:#134E4A;color:white;padding:12px 24px;border-radius:50px;font-size:14px;font-weight:500;z-index:2000;opacity:0;transition:all .3s;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:600px){
  .lcard{padding:32px 24px;}
  .content{padding:16px;}
  .hdr{padding:0 16px;}
  .rgrid{grid-template-columns:repeat(2,1fr);}
  .modal{padding:24px 20px;}
  .fab{bottom:20px;right:20px;width:52px;height:52px;font-size:24px;}
  .session-tabs{flex-direction:column;}
}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:#A7F3D0;border-radius:99px;}
</style>
</head>
<body>

<div id="loadingPage">
  <div class="spinner-wrap"><div class="sp"></div></div>
  <p>추론적 듣기 심화 탐구방 불러오는 중...</p>
</div>

<div id="loginPage" class="hidden">
  <div class="lcard">
    <div class="llogo">
      <span class="em">🎧</span>
      <h1>추론적 듣기 심화 탐구방</h1>
      <p>3단원 능동적인 언어생활 · 추론하며 듣기 · <span style="color:var(--muted);">by 우겸T</span></p>
    </div>
    <div class="fg">
      <label>이름</label>
      <input type="text" id="inName" placeholder="이름을 입력하세요" autocomplete="name" inputmode="text">
    </div>
    <div class="fg">
      <label>생일 4자리 (예: 0417)</label>
      <input type="tel" id="inBirth" placeholder="생일 4자리 (예: 0417)" maxlength="4" inputmode="numeric" pattern="[0-9]*">
    </div>
    <button class="btn btn-p lbtn" id="loginBtn">로그인 🚀</button>
    <div id="loginErr" class="lerr hidden"></div>
  </div>
</div>

<div id="mainPage" class="hidden">
  <header class="hdr">
    <div class="hdr-logo" id="logoBtn">🎧 추론적 듣기 탐구방</div>
    <div class="hdr-r">
      <div class="ubadge">
        <span id="uname"></span>
        <span id="atag" class="atag hidden">ADMIN</span>
      </div>
      <button class="btn lout-btn" id="logoutBtn">로그아웃</button>
    </div>
  </header>
  <div class="content" id="content"></div>
</div>

<button class="fab hidden" id="fabBtn">＋</button>

<div class="mback hidden" id="mback">
  <div class="modal">
    <h3 id="mtitle">✏️ 답변 작성</h3>
    <div id="mQuestionsArea"></div>
    <div class="mact">
      <button class="btn btn-g" id="mCancel">취소</button>
      <button class="btn btn-p" id="mSubmit">등록하기</button>
    </div>
  </div>
</div>

<div class="cmedit-back hidden" id="cmEditBack">
  <div class="cmedit-box">
    <h4>💬 댓글 수정</h4>
    <textarea class="cmedit-ta" id="cmEditTa" placeholder="댓글 내용을 수정하세요"></textarea>
    <div class="cmedit-act">
      <button class="btn btn-g" id="cmEditCancel" style="padding:8px 18px;font-size:13px;">취소</button>
      <button class="btn btn-p" id="cmEditSave" style="padding:8px 18px;font-size:13px;">수정 완료</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

    passage2:"【 🎙 주제: 선생님  │  📚 2차시 — 뉴스 형식 / 관점·가치관 추론 】\n\n앵커: 교사와 학생 사이의 관계가 예전과 달라지고 있다는 목소리가 커지고 있습니다. 학생 인권이 강조되면서 교사의 지도 권한이 약해졌다는 우려와, 오히려 더 수평적인 관계가 필요하다는 주장이 맞서고 있습니다.\n\n기자: 현장 교사들은 변화된 환경에서의 어려움을 토로합니다.\n\n교사: 학생한테 뭔가를 지적하거나 조언을 하면 왜 그러냐는 반응이 나올 때가 있어요. 진심으로 걱정해서 하는 말인데, 그게 간섭으로 받아들여지면 교사 입장에서 굉장히 힘들죠. 요즘은 말 한마디 잘못하면 민원이 들어오기도 하니까 점점 조심스러워지는 게 사실이에요.\n\n기자: 반면 학생들은 다른 시각을 갖고 있습니다.\n\n학생A: 선생님이 진심으로 걱정해주신다는 거 느껴질 때는 좋아요. 근데 일방적으로 훈계만 하시면 그건 좀 다른 것 같아요. 제 얘기를 들어주시는 것 같지 않거든요.\n\n학생B: 저는 솔직하게 들어주시는 선생님이 훨씬 좋더라고요. 그냥 형식적인 상담보다. 진짜로 내 편인 것 같은 느낌이 들 때가 있거든요."

var COLORS=["#0D9488","#10B981","#F59E0B","#EF4444","#8B5CF6","#0EA5E9","#EC4899","#14B8A6","#F97316","#84CC16"];
function gc(n){var s=0;for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);return COLORS[s%COLORS.length];}
function ge(id){return document.getElementById(id);}
function stopAllAudio(){
  document.querySelectorAll("audio").forEach(function(a){a.pause();});
}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function ft(ts){
  if(!ts)return"";
  var d=new Date(ts),now=new Date(),df=Math.floor((now-d)/1000);
  if(df<60)return"방금 전";
  if(df<3600)return Math.floor(df/60)+"분 전";
  if(df<86400)return Math.floor(df/3600)+"시간 전";
  return(d.getMonth()+1)+"/"+(d.getDate());
}
var _tt=null;
function toast(msg){
  var el=ge("toast");el.textContent=msg;el.classList.add("show");
  if(_tt)clearTimeout(_tt);
  _tt=setTimeout(function(){el.classList.remove("show");},2500);
}
function rk(s){return encodeURIComponent(s);}
function showOnly(id){
  ["loadingPage","loginPage","mainPage"].forEach(function(p){
    ge(p).classList.toggle("hidden",p!==id);
  });
}

// ── 상태 ──
var db=null, cu=null, cg=null, cs=null, eid=null;
var postLsn=null, cmtLsns={};
var cmEditPid=null, cmEditCid=null;

// ── Firebase 초기화 ──
function startApp(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
  }catch(e){
    console.error("FB init error:",e);
    showOnly("loginPage");
    return;
  }
  // 세션 복원
  try{
    var s=sessionStorage.getItem("inferUser");
    if(s){
      var u=JSON.parse(s);
      if(u&&u.name){
        cu=u;
        ge("uname").textContent=u.name;
        ge("atag").classList.toggle("hidden",!u.isAdmin);
        showOnly("mainPage");
        // 위치 복원
        try{
          var pos=JSON.parse(sessionStorage.getItem("inferPos")||"{}");
          if(pos.group){
            cg=pos.group;
            if(pos.session){
              cs=pos.session;
              renderBoard();
            }else{
              renderGroupHome(pos.group);
            }
          }else{
            renderHome();
          }
        }catch(e){renderHome();}
        return;
      }
    }
  }catch(e){}
  showOnly("loginPage");
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",startApp);
}else{
  startApp();
}

// ── 로그인 ──
function doLogin(){
  var name=ge("inName").value.trim();
  var birth=ge("inBirth").value.trim();
  if(!name||!birth){setErr("이름과 생일을 모두 입력해 주세요.");return;}
  var found=null;
  for(var i=0;i<STUDENTS.length;i++){if(STUDENTS[i].name===name&&STUDENTS[i].birth===birth){found=STUDENTS[i];break;}}
  if(!found){setErr("정보가 일치하지 않습니다. 다시 확인해 주세요.");return;}
  cu={name:found.name,isAdmin:found.role==="admin"};
  sessionStorage.setItem("inferUser",JSON.stringify(cu));
  sessionStorage.removeItem("inferPos");
  ge("loginErr").classList.add("hidden");
  ge("uname").textContent=cu.name;
  ge("atag").classList.toggle("hidden",!cu.isAdmin);
  showOnly("mainPage");
  renderHome();
}
function setErr(m){ge("loginErr").textContent=m;ge("loginErr").classList.remove("hidden");}
ge("loginBtn").addEventListener("click",doLogin);
ge("inName").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
ge("inBirth").addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});

// ── 로그아웃 ──
ge("logoutBtn").addEventListener("click",function(){
  detach();
  cu=null;cg=null;cs=null;
  sessionStorage.removeItem("inferUser");
  sessionStorage.removeItem("inferPos");
  ge("fabBtn").classList.add("hidden");
  ge("inName").value="";ge("inBirth").value="";
  showOnly("loginPage");
});

function savePos(group,session){
  try{sessionStorage.setItem("inferPos",JSON.stringify({group:group||null,session:session||null}));}catch(e){}
}

ge("logoBtn").addEventListener("click",function(){renderHome();});

// ── 홈: 조 선택 ──
function renderHome(){
  stopAllAudio();
  cg=null;cs=null;detach();
  ge("fabBtn").classList.add("hidden");
  savePos(null,null);
  var cards = GROUPS.map(function(g){
    return '<div class="rcard rc-'+g.key+'" data-group="'+g.key+'">'
      +'<span class="ri">'+g.icon+'</span>'
      +'<div class="rn">'+g.name+' 조</div>'
      +'<div class="rc">1차시 · 2차시</div>'
      +'</div>';
  }).join("");
  ge("content").innerHTML =
    '<div class="home">'
    +'<h2>🎧 추론적 듣기 심화 탐구방</h2>'
    +'<p class="sub">담당 조의 음원을 듣고, 질문에 대한 답을 작성해보세요. 다른 친구들의 답변도 함께 볼 수 있어요!</p>'
    +'<div class="rsec"><h3>📚 모둠 선택</h3><div class="rgrid">'+cards+'</div></div>'
    +'</div>';
  ge("content").querySelectorAll(".rcard").forEach(function(card){
    card.addEventListener("click",function(){renderGroupHome(this.getAttribute("data-group"));});
  });
}

function getGroup(key){
  for(var i=0;i<GROUPS.length;i++)if(GROUPS[i].key===key)return GROUPS[i];
  return null;
}

// ── 조 홈: 1차시/2차시 선택 ──
function renderGroupHome(key){
  stopAllAudio();
  cg=key;cs=null;detach();
  ge("fabBtn").classList.add("hidden");
  savePos(key,null);
  var g=getGroup(key);
  ge("content").innerHTML =
    '<div class="bhdr">'
    +'<button class="back-btn" id="backBtn">← 뒤로</button>'
    +'<div class="btitle">'+g.icon+' '+g.name+' 조</div>'
    +'</div>'
    +'<div class="session-tabs">'
    +'<div class="session-tab" data-s="1"><div class="stitle">📌 1차시</div><div class="sdesc">일상 대화 · 의도 추론</div></div>'
    +'<div class="session-tab" data-s="2"><div class="stitle">📌 2차시</div><div class="sdesc">뉴스 듣기 · 관점·가치관 추론</div></div>'
    +'</div>'
    +'<div style="text-align:center;color:var(--muted);font-size:13px;padding:40px 0;">위에서 차시를 선택하세요</div>';
  ge("backBtn").addEventListener("click",function(){renderHome();});
  ge("content").querySelectorAll(".session-tab").forEach(function(tab){
    tab.addEventListener("click",function(){
      enterSession(this.getAttribute("data-s"));
    });
  });
}

// ── 세션(차시) 진입 ──
function enterSession(s){
  cs=s;
  savePos(cg,s);
  renderBoard();
}

function renderBoard(){
  stopAllAudio();
  var g=getGroup(cg);
  if(!g){renderHome();return;}
  var audio = cs==="1" ? g.audio1 : g.audio2;
  var passage = cs==="1" ? g.passage1 : g.passage2;
  var qs = cs==="1" ? g.q1 : g.q2;
  var sessionLabel = cs==="1" ? "1차시 · 일상 대화 (의도 추론)" : "2차시 · 뉴스 (관점·가치관 추론)";

  var adminPassageBtn = "";
  if(cu&&cu.isAdmin){
    adminPassageBtn = '<button class="passage-toggle" id="passageToggle">📖 지문 보기/숨기기 (관리자용)</button>'
      +'<div class="passage-box hidden" id="passageBox">'+esc(passage)+'</div>';
  }

  var qcards = qs.map(function(q,i){
    return '<div class="qcard"><span class="qnum">Q'+(i+1)+'</span><div class="qtext">'+esc(q)+'</div></div>';
  }).join("");

  ge("fabBtn").classList.remove("hidden");
  ge("content").innerHTML =
    '<div class="bhdr">'
    +'<button class="back-btn" id="backBtn">← 뒤로</button>'
    +'<div class="btitle">'+g.icon+' '+g.name+' 조</div>'
    +'<span class="bbadge" style="background:var(--c-'+g.key+')">'+sessionLabel+'</span>'
    +'<div class="rt-label"><span class="rt-dot"></span>실시간</div>'
    +'</div>'
    +'<div class="audio-box">'
    +'<div class="albl">🎧 음원 듣기</div>'
    +'<audio controls preload="none" src="'+audio+'"></audio>'
    +adminPassageBtn
    +'</div>'
    +'<div style="margin-bottom:16px;">'+qcards+'</div>'
    +'<div id="board"><div class="loading"><div class="sp2"></div><p style="color:var(--muted)">불러오는 중...</p></div></div>';

  ge("backBtn").addEventListener("click",function(){renderGroupHome(cg);});
  if(cu&&cu.isAdmin){
    ge("passageToggle").addEventListener("click",function(){
      ge("passageBox").classList.toggle("hidden");
    });
  }
  attachPost();
}

// ── 답변 게시판 ──
function attachPost(){
  detach();
  var ref=db.ref("inferposts/"+cg+"/s"+cs);
  postLsn=ref;
  ref.on("value",function(snap){
    var posts=[];
    if(snap.exists())snap.forEach(function(c){var v=c.val();v.id=c.key;posts.push(v);});
    posts.sort(function(a,b){return(b.createdAt||0)-(a.createdAt||0);});
    var el=ge("board");
    if(!el)return;
    if(!posts.length){
      el.innerHTML='<div class="empty"><span class="ei">📝</span><p>아직 작성된 답변이 없어요!</p><small>오른쪽 아래 + 버튼을 눌러 답변을 작성해보세요 😊</small></div>';
      return;
    }
    el.innerHTML='<div class="cgrid">'+posts.map(renderCard).join("")+'</div>';
    el.querySelectorAll(".edit-btn").forEach(function(b){b.addEventListener("click",function(){openEdit(this.getAttribute("data-id"));});});
    el.querySelectorAll(".del-btn").forEach(function(b){b.addEventListener("click",function(){delPost(this.getAttribute("data-id"));});});
    el.querySelectorAll(".cmttog").forEach(function(b){
      var pid=b.getAttribute("data-pid");
      loadCmts(pid);
      b.addEventListener("click",function(){
        var list=ge("clist-"+pid);
        var open=list.classList.toggle("hidden");
        updateTogBtn(b,pid,!open);
      });
    });
    el.querySelectorAll(".csub").forEach(function(b){b.addEventListener("click",function(){submitCmt(this.getAttribute("data-pid"));});});
    el.querySelectorAll(".cin").forEach(function(ta){
      ta.addEventListener("keydown",function(e){
        if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();submitCmt(ta.getAttribute("data-pid"));}
      });
    });
  });
}

function detach(){
  if(postLsn){postLsn.off();postLsn=null;}
  Object.keys(cmtLsns).forEach(function(k){if(cmtLsns[k])cmtLsns[k].off();});
  cmtLsns={};
}

function renderCard(p){
  var isOwn=cu&&cu.name===p.authorName;
  var isAdm=cu&&cu.isAdmin;
  var col=gc(p.authorName);
  var foot="";
  if(isOwn||isAdm){
    foot='<div class="pfoot">'
      +(isOwn?'<button class="edit-btn" data-id="'+p.id+'">✏️ 수정</button>':"")
      +(isOwn||isAdm?'<button class="del-btn" data-id="'+p.id+'">🗑 삭제</button>':"")
      +'</div>';
  }
  var g=getGroup(cg);
  var qs = cs==="1" ? g.q1 : g.q2;
  var ans = p.answers||[];
  var answersHtml = qs.map(function(q,i){
    var a = ans[i*2] || "";
    var r = ans[i*2+1] || "";
    if(!a && !r) return "";
    var reasonHtml = r ? '<div style="font-size:11px;color:var(--muted);margin-top:4px;"><b style="color:var(--primary);">💡 이유:</b> '+esc(r)+'</div>' : "";
    return '<div style="margin-bottom:10px;"><div style="font-size:11px;font-weight:700;color:var(--primary);margin-bottom:3px;">Q'+(i+1)+'. '+esc(q)+'</div><div class="pbody">'+esc(a)+'</div>'+reasonHtml+'</div>';
  }).join("");

  return '<div class="pcard" id="pc-'+p.id+'" style="border-left-color:'+col+'">'
    +'<div class="pau">'
    +'<div class="pav" style="background:'+col+'">'+esc(p.authorName.charAt(0))+'</div>'
    +'<div class="pan">'+esc(p.authorName)+'</div>'
    +'<div class="pt">'+ft(p.createdAt)+'</div>'
    +'</div>'
    +answersHtml
    +foot
    +'<div class="cmtsec">'
    +'<button class="cmttog" data-pid="'+p.id+'">💬 댓글 보기</button>'
    +'<div class="cmtlist hidden" id="clist-'+p.id+'"></div>'
    +'<div class="cinrow">'
    +'<textarea class="cin" id="cin-'+p.id+'" data-pid="'+p.id+'" placeholder="댓글을 입력하세요..." rows="1"></textarea>'
    +'<button class="csub" data-pid="'+p.id+'">등록</button>'
    +'</div>'
    +'</div>'
    +'</div>';
}

// ── 댓글 ──
function updateTogBtn(btn,pid,isOpen){
  var list=ge("clist-"+pid);
  var cnt=list.querySelectorAll(".citem").length;
  btn.textContent=isOpen?"💬 댓글 접기":"💬 댓글 "+(cnt>0?cnt+"개 보기":"달기");
}

function loadCmts(pid){
  if(cmtLsns[pid])cmtLsns[pid].off();
  var ref=db.ref("infercomments/"+cg+"/s"+cs+"/"+pid);
  cmtLsns[pid]=ref;
  ref.on("value",function(snap){
    var list=ge("clist-"+pid);
    var togBtn=document.querySelector(".cmttog[data-pid='"+pid+"']");
    if(!list)return;
    var cmts=[];
    if(snap.exists())snap.forEach(function(c){var v=c.val();v.id=c.key;cmts.push(v);});
    cmts.sort(function(a,b){return(a.createdAt||0)-(b.createdAt||0);});
    if(!cmts.length){
      list.innerHTML='<div style="font-size:12px;color:var(--muted);padding:6px 0">아직 댓글이 없어요. 첫 댓글을 달아보세요!</div>';
    }else{
      list.innerHTML=cmts.map(function(c){
        var isAdmC=c.isAdmin;
        var canDel=cu&&(cu.name===c.authorName||cu.isAdmin);
        return '<div class="citem'+(isAdmC?" adm":"")+'" id="ci-'+c.id+'">'
          +'<div class="chdr">'
          +'<div class="cav'+(isAdmC?" adm-av":"")+'" '+(isAdmC?'':' style="background:'+gc(c.authorName)+'"')+'>'+esc(c.authorName.charAt(0))+'</div>'
          +'<span class="can'+(isAdmC?" adm-n":"")+'">'+esc(c.authorName)+(isAdmC?'<span class="abadge">선생님</span>':'')+' </span>'
          +'<span class="ct">'+ft(c.createdAt)+'</span>'
          +'</div>'
          +'<div class="cbody">'+esc(c.body)+'</div>'
          +(canDel?('<div class="cbtns">'
            +(cu&&cu.name===c.authorName?'<button class="cedit-btn" data-pid="'+pid+'" data-cid="'+c.id+'" data-body="'+esc(c.body)+'">✏️ 수정</button>':"")
            +'<button class="cdel" data-pid="'+pid+'" data-cid="'+c.id+'">🗑 삭제</button>'
            +'</div>'):"")
          +'</div>';
      }).join("");
      list.querySelectorAll(".cdel").forEach(function(b){
        b.addEventListener("click",function(){delCmt(this.getAttribute("data-pid"),this.getAttribute("data-cid"));});
      });
      list.querySelectorAll(".cedit-btn").forEach(function(b){
        b.addEventListener("click",function(){openCmEdit(this.getAttribute("data-pid"),this.getAttribute("data-cid"),this.getAttribute("data-body"));});
      });
    }
    if(togBtn)updateTogBtn(togBtn,pid,!list.classList.contains("hidden"));
  });
}

function submitCmt(pid){
  var ta=ge("cin-"+pid);
  if(!ta)return;
  var body=ta.value.trim();
  if(!body){toast("댓글 내용을 입력해주세요!");return;}
  db.ref("infercomments/"+cg+"/s"+cs+"/"+pid).push({
    body:body,authorName:cu.name,isAdmin:cu.isAdmin?true:false,createdAt:Date.now()
  }).then(function(){
    ta.value="";
    var list=ge("clist-"+pid);
    var togBtn=document.querySelector(".cmttog[data-pid='"+pid+"']");
    if(list&&list.classList.contains("hidden")){
      list.classList.remove("hidden");
      if(togBtn)togBtn.textContent="💬 댓글 접기";
    }
    toast("💬 댓글이 등록되었습니다!");
  }).catch(function(e){toast("❌ 오류: "+e.message);});
}

function openCmEdit(pid,cid,body){
  cmEditPid=pid;cmEditCid=cid;
  ge("cmEditTa").value=body||"";
  ge("cmEditBack").classList.remove("hidden");
  setTimeout(function(){ge("cmEditTa").focus();},100);
}
ge("cmEditCancel").addEventListener("click",function(){ge("cmEditBack").classList.add("hidden");cmEditPid=null;cmEditCid=null;});
ge("cmEditBack").addEventListener("click",function(e){if(e.target===ge("cmEditBack")){ge("cmEditBack").classList.add("hidden");cmEditPid=null;cmEditCid=null;}});
ge("cmEditSave").addEventListener("click",function(){
  var body=ge("cmEditTa").value.trim();
  if(!body){toast("댓글 내용을 입력해주세요!");return;}
  if(!cmEditPid||!cmEditCid)return;
  var btn=ge("cmEditSave");btn.disabled=true;btn.textContent="저장 중...";
  db.ref("infercomments/"+cg+"/s"+cs+"/"+cmEditPid+"/"+cmEditCid)
    .update({body:body,updatedAt:Date.now()})
    .then(function(){
      toast("✅ 댓글이 수정되었습니다!");
      ge("cmEditBack").classList.add("hidden");
      cmEditPid=null;cmEditCid=null;
    })
    .catch(function(e){toast("❌ 오류: "+e.message);})
    .finally(function(){btn.disabled=false;btn.textContent="수정 완료";});
});

function delCmt(pid,cid){
  if(!confirm("댓글을 삭제할까요?"))return;
  db.ref("infercomments/"+cg+"/s"+cs+"/"+pid+"/"+cid).remove()
    .then(function(){toast("댓글이 삭제되었습니다.");})
    .catch(function(e){toast("❌ 오류: "+e.message);});
}

// ── 답변 작성 모달 ──
ge("fabBtn").addEventListener("click",function(){
  eid=null;
  ge("mtitle").textContent="✏️ 답변 작성";
  buildAnswerForm();
  ge("mSubmit").textContent="등록하기";
  ge("mback").classList.remove("hidden");
});

function buildAnswerForm(existingAnswers){
  var g=getGroup(cg);
  var qs = cs==="1" ? g.q1 : g.q2;
  var html = qs.map(function(q,i){
    var ansVal = existingAnswers ? esc(existingAnswers[i*2]||"") : "";
    var reasonVal = existingAnswers ? esc(existingAnswers[i*2+1]||"") : "";
    return '<div class="mfg">'
      +'<div class="qtext-modal"><b>Q'+(i+1)+'.</b> '+esc(q)+'</div>'
      +'<textarea id="ans-'+i+'" placeholder="답변을 작성하세요" style="margin-bottom:8px;">'+ansVal+'</textarea>'
      +'<label style="font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px;">💡 위와 같이 답변한 이유는 무엇인가요?</label>'
      +'<textarea id="reason-'+i+'" placeholder="이유(근거)를 작성하세요">'+reasonVal+'</textarea>'
      +'</div>';
  }).join("");
  ge("mQuestionsArea").innerHTML = html;
}

function openEdit(pid){
  db.ref("inferposts/"+cg+"/s"+cs+"/"+pid).once("value").then(function(snap){
    if(!snap.exists())return;
    var p=snap.val();eid=pid;
    ge("mtitle").textContent="✏️ 답변 수정";
    buildAnswerForm(p.answers||[]);
    ge("mSubmit").textContent="수정 완료";
    ge("mback").classList.remove("hidden");
  });
}
function closeModal(){ge("mback").classList.add("hidden");eid=null;}
ge("mCancel").addEventListener("click",closeModal);
// 배경 클릭으로 모달 닫기 비활성화 (취소 버튼으로만 닫기)
ge("mSubmit").addEventListener("click",function(){
  var g=getGroup(cg);
  var qs = cs==="1" ? g.q1 : g.q2;
  var answers=[];
  var allEmpty=true;
  for(var i=0;i<qs.length;i++){
    var v=ge("ans-"+i).value.trim();
    var r=ge("reason-"+i).value.trim();
    answers.push(v);
    answers.push(r);
    if(v||r)allEmpty=false;
  }
  if(allEmpty){toast("답변을 1개 이상 입력해주세요!");return;}
  var btn=ge("mSubmit");btn.disabled=true;btn.textContent="저장 중...";
  var ref=db.ref("inferposts/"+cg+"/s"+cs);
  var p;
  if(eid){
    p=ref.child(eid).update({answers:answers,updatedAt:Date.now()});
  }else{
    p=ref.push({answers:answers,authorName:cu.name,createdAt:Date.now(),updatedAt:null});
  }
  p.then(function(){
    toast(eid?"✅ 수정되었습니다!":"🎉 답변이 등록되었습니다!");
    closeModal();
  }).catch(function(e){
    toast("❌ 저장 실패: "+e.message);
  }).finally(function(){
    btn.disabled=false;btn.textContent=eid?"수정 완료":"등록하기";
  });
});

function delPost(pid){
  if(!confirm("이 답변을 삭제할까요?"))return;
  db.ref("inferposts/"+cg+"/s"+cs+"/"+pid).remove()
    .then(function(){toast("🗑 삭제되었습니다.");})
    .catch(function(e){toast("❌ 삭제 실패: "+e.message);});
}
</script>
</body>
</html>
